<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="実績タイムライン">
<link rel="manifest" href="manifest.webmanifest">
<title>実績タイムライン</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--text:#111;--muted:#777;--line:#e4e4df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:88px}
.wrap{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 30px}
h1{font-size:29px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.mainbtn{width:100%;border:0;border-radius:16px;background:#111;color:#fff;padding:18px;font-size:18px;font-weight:800}
h2{font-size:16px;margin:22px 2px 10px}.entry{display:grid;grid-template-columns:78px 12px 1fr;gap:9px;min-height:70px}
.time{font-size:12px;color:var(--muted);text-align:right;padding-top:12px;line-height:1.35}.rail{position:relative}.rail:before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}.dot{position:absolute;left:1px;top:16px;width:10px;height:10px;border-radius:50%;background:#111;border:2px solid var(--bg)}
.ecard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin-bottom:9px;display:flex;justify-content:space-between;gap:12px}.txt{font-size:15px;line-height:1.5}.meta{font-size:11px;color:var(--muted);margin-top:3px}.more{border:0;background:none;color:#777;font-size:18px}
.empty{border:1px dashed #ccc;border-radius:17px;padding:28px 14px;text-align:center;color:#777}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(250,250,248,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.navi{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.navbtn{border:0;background:none;border-radius:12px;padding:10px 4px;color:#777;font-weight:700}.navbtn.on{background:#111;color:#fff}
.view{display:none}.view.on{display:block}
.cal{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}.calhead{display:flex;justify-content:space-between;align-items:center}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.wd{text-align:center;color:#888;font-size:11px}.day{aspect-ratio:1;border:0;background:none;border-radius:12px;position:relative}.day.sel{background:#111;color:#fff}.day.today{outline:2px solid #111;font-weight:800}.mark{position:absolute;width:5px;height:5px;background:currentColor;border-radius:50%;bottom:4px;left:50%;transform:translateX(-50%)}
.smallbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap}.data{margin-bottom:12px}.data p{font-size:13px;color:#777;line-height:1.6}
dialog{border:0;border-radius:22px;width:min(92vw,520px);padding:0;box-shadow:0 25px 70px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.28)}.modal{padding:18px}.modal h3{margin:0 0 10px}.modal textarea{width:100%;min-height:110px;border:1px solid #ccc;border-radius:14px;padding:13px;font-size:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.fields input{width:100%;padding:10px;border:1px solid #ccc;border-radius:11px}.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:12px}.actions button{padding:12px;border-radius:13px;font-weight:800}.cancel{border:1px solid var(--line);background:#fff}.save{border:0;background:#111;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <section id="today" class="view on">
    <h1>今日の実績</h1><div class="sub" id="now"></div>
    <div class="card"><button class="mainbtn" id="add">＋ 今まで何してた？</button><div class="sub" style="margin:10px 2px 0">終わった直後に1行だけ。終了時刻は自動で現在時刻になります。</div></div>
    <h2>今日のタイムライン <span id="count" style="float:right;color:#777;font-size:12px"></span></h2>
    <div id="timeline"></div>
  </section>

  <section id="history" class="view">
    <h1>カレンダー</h1><div class="sub">過去の実績を日付から見返せます。</div>
    <div class="cal">
      <div class="calhead"><button class="smallbtn" id="prev">‹</button><b id="month"></b><button class="smallbtn" id="next">›</button></div>
      <div class="calgrid" id="week"></div><div class="calgrid" id="days"></div>
    </div>
    <h2 id="pickedTitle"></h2><div id="picked"></div>
  </section>

  <section id="data" class="view">
    <h1>データ</h1><div class="sub">ChatGPTに渡したり、バックアップできます。</div>
    <div class="card data"><b>ChatGPTに渡す</b><p>読みやすいテキスト形式でコピーします。</p><div class="row"><button class="smallbtn" id="copyToday">今日をコピー</button><button class="smallbtn" id="copyWeek">直近7日をコピー</button></div></div>
    <div class="card data"><b>バックアップ</b><p>記録はこのSafari内に保存されます。ときどき書き出してください。</p><div class="row"><button class="smallbtn" id="json">JSON</button><button class="smallbtn" id="csv">CSV</button></div></div>
  </section>
</div>

<nav><div class="navi"><button class="navbtn on" data-v="today">今日</button><button class="navbtn" data-v="history">履歴</button><button class="navbtn" data-v="data">データ</button></div></nav>

<dialog id="dlg"><form method="dialog" class="modal" id="form"><h3 id="dtitle">今まで何してた？</h3><textarea id="text" placeholder="例：卒論のフォームを修正した" required></textarea><div class="fields"><input id="start" type="datetime-local"><input id="end" type="datetime-local" required></div><div class="actions"><button type="button" class="cancel" id="cancel">キャンセル</button><button class="save" type="submit">記録する</button></div></form></dialog>

<script>
(function(){
var KEY='actualTimeline.v1', entries=[], editing=null, cursor=new Date(), picked=key(new Date());
function q(s){return document.querySelector(s)} function qa(s){return Array.from(document.querySelectorAll(s))}
function pad(n){return String(n).padStart(2,'0')} function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function local(d){return key(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())} function time(v){if(!v)return '—';var d=new Date(v);return pad(d.getHours())+':'+pad(d.getMinutes())}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function load(){try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(entries))entries=[]}catch(e){entries=[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(entries));render()}
function list(k){return entries.filter(function(e){return e.date===k}).sort(function(a,b){return new Date(a.end)-new Date(b.end)})}
function dur(a,b){if(!a||!b)return '';var m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000)),h=Math.floor(m/60),r=m%60;return h?(h+'時間'+(r?r+'分':'')):(r+'分')}
function draw(el,arr){if(!arr.length){el.innerHTML='<div class="empty">まだ記録がありません。</div>';return}el.innerHTML=arr.map(function(e){return '<div class="entry"><div class="time">'+time(e.start)+'<br>→ '+time(e.end)+'</div><div class="rail"><span class="dot"></span></div><div class="ecard"><div><div class="txt">'+esc(e.text)+'</div><div class="meta">'+dur(e.start,e.end)+'</div></div><button class="more" data-id="'+e.id+'">•••</button></div></div>'}).join('')}
function renderToday(){var a=list(key(new Date()));q('#count').textContent=a.length+'件';draw(q('#timeline'),a)}
function renderCal(){var y=cursor.getFullYear(),m=cursor.getMonth();q('#month').textContent=y+'年 '+(m+1)+'月';q('#week').innerHTML=['日','月','火','水','木','金','土'].map(function(x){return '<div class="wd">'+x+'</div>'}).join('');var first=new Date(y,m,1),start=first.getDay(),last=new Date(y,m+1,0).getDate(),html='';for(var i=0;i<42;i++){var dt;if(i<start)dt=new Date(y,m,i-start+1);else if(i>=start+last)dt=new Date(y,m+1,i-start-last+1);else dt=new Date(y,m,i-start+1);var k=key(dt),cls='day'+(k===picked?' sel':'')+(k===key(new Date())?' today':'');html+='<button class="'+cls+'" data-day="'+k+'">'+dt.getDate()+(list(k).length?'<span class="mark"></span>':'')+'</button>'}q('#days').innerHTML=html;q('#pickedTitle').textContent=picked;draw(q('#picked'),list(picked))}
function render(){renderToday();renderCal()}
function prevEnd(k,end){var a=list(k).filter(function(e){return e.id!==editing&&new Date(e.end)<=end});return a.length?a[a.length-1].end:null}
function openNew(){editing=null;var d=new Date(),pv=prevEnd(key(d),d);q('#dtitle').textContent='今まで何してた？';q('#text').value='';q('#end').value=local(d);q('#start').value=pv?local(new Date(pv)):'';q('#dlg').showModal();setTimeout(function(){q('#text').focus()},100)}
q('#add').onclick=openNew;q('#cancel').onclick=function(){q('#dlg').close()}
q('#form').onsubmit=function(ev){ev.preventDefault();var t=q('#text').value.trim(),e=new Date(q('#end').value),s=q('#start').value?new Date(q('#start').value):null;if(!t||isNaN(e))return;var k=key(e);if(!s){var p=prevEnd(k,e);if(p)s=new Date(p)}if(s&&s>e){alert('開始時刻が終了時刻より後です');return}if(editing){var ix=entries.findIndex(function(x){return x.id===editing});entries[ix]={id:editing,text:t,date:k,start:s?s.toISOString():null,end:e.toISOString()}}else entries.push({id:Date.now()+'-'+Math.random(),text:t,date:k,start:s?s.toISOString():null,end:e.toISOString()});q('#dlg').close();editing=null;save()}
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-id]');if(b){var id=b.dataset.id,act=prompt('「編集」または「削除」と入力してください');if(act==='削除'){if(confirm('削除しますか？')){entries=entries.filter(function(x){return x.id!==id});save()}}else if(act==='編集'){var x=entries.find(function(z){return z.id===id});editing=id;q('#dtitle').textContent='記録を編集';q('#text').value=x.text;q('#start').value=x.start?local(new Date(x.start)):'';q('#end').value=local(new Date(x.end));q('#dlg').showModal()}return}var d=ev.target.closest('[data-day]');if(d){picked=d.dataset.day;var p=picked.split('-');cursor=new Date(+p[0],+p[1]-1,1);renderCal()}})
qa('.navbtn').forEach(function(b){b.onclick=function(){qa('.navbtn').forEach(function(x){x.classList.remove('on')});b.classList.add('on');qa('.view').forEach(function(x){x.classList.remove('on')});q('#'+b.dataset.v).classList.add('on')}})
q('#prev').onclick=function(){cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);renderCal()};q('#next').onclick=function(){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);renderCal()}
function makeText(a){var g={};a.slice().sort(function(x,y){return new Date(x.end)-new Date(y.end)}).forEach(function(e){(g[e.date]||(g[e.date]=[])).push(e)});return Object.keys(g).map(function(k){return k+'\n'+g[k].map(function(e){return time(e.start)+'-'+time(e.end)+' '+e.text}).join('\n')}).join('\n\n')}
async function copy(t){try{await navigator.clipboard.writeText(t);alert('コピーしました')}catch(e){alert(t)}}
q('#copyToday').onclick=function(){copy(makeText(list(key(new Date()))))};q('#copyWeek').onclick=function(){var en=new Date(),st=new Date();st.setDate(st.getDate()-6);st.setHours(0,0,0,0);copy(makeText(entries.filter(function(e){var d=new Date(e.end);return d>=st&&d<=en}))}
function dl(n,c,t){var a=document.createElement('a'),u=URL.createObjectURL(new Blob([c],{type:t}));a.href=u;a.download=n;a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
q('#json').onclick=function(){dl('timeline-'+key(new Date())+'.json',JSON.stringify(entries,null,2),'application/json')};q('#csv').onclick=function(){var rows=[['date','start','end','text']].concat(entries.map(function(e){return [e.date,e.start||'',e.end,e.text]}));var c='\ufeff'+rows.map(function(r){return r.map(function(x){return '"'+String(x||'').replace(/"/g,'""')+'"'}).join(',')}).join('\n');dl('timeline-'+key(new Date())+'.csv',c,'text/csv')}
function clock(){var d=new Date();q('#now').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes())}clock();setInterval(clock,30000);load();render();if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})
})();
</script>
</body>
</html>
