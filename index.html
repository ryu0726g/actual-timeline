<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="実績タイムライン">
<link rel="manifest" href="manifest.webmanifest">
<title>実績タイムライン</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--text:#111;--muted:#777;--line:#e4e4df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:160px}
.wrap{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 30px}
h1{font-size:29px;margin:0 0 6px}.titleline{display:flex;align-items:baseline;gap:8px}.version{font-size:11px;color:#999;font-weight:700;white-space:nowrap}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.mainbtn{width:100%;border:0;border-radius:16px;background:#111;color:#fff;padding:18px;font-size:18px;font-weight:800}
.quickbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:20;padding:10px 16px;background:linear-gradient(to top,rgba(246,246,243,.98),rgba(246,246,243,.88),rgba(246,246,243,0))}
.quickbar-inner{max-width:720px;margin:auto}
.quickbar .mainbtn{box-shadow:0 10px 28px rgba(0,0,0,.18)}
.history-add{margin:0 0 12px;width:100%}
h2{font-size:16px;margin:22px 2px 10px}.entry{display:grid;grid-template-columns:78px 12px 1fr;gap:9px;min-height:70px}
.time{font-size:12px;color:var(--muted);text-align:right;padding-top:12px;line-height:1.35}.rail{position:relative}.rail:before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}.dot{position:absolute;left:1px;top:16px;width:10px;height:10px;border-radius:50%;background:#111;border:2px solid var(--bg)}
.ecard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin-bottom:9px;display:flex;justify-content:space-between;gap:12px}.txt{font-size:15px;line-height:1.5}.meta{font-size:11px;color:var(--muted);margin-top:3px}.more{border:0;background:none;color:#777;font-size:18px}
.empty{border:1px dashed #ccc;border-radius:17px;padding:28px 14px;text-align:center;color:#777}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(250,250,248,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.navi{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.navbtn{border:0;background:none;border-radius:12px;padding:10px 4px;color:#777;font-weight:700}.navbtn.on{background:#111;color:#fff}
.view{display:none}.view.on{display:block}
.cal{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}.calhead{display:flex;justify-content:space-between;align-items:center}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.wd{text-align:center;color:#888;font-size:11px}.day{aspect-ratio:1;border:0;background:none;border-radius:12px;position:relative}.day.sel{background:#111;color:#fff}.day.today{outline:2px solid #111;font-weight:800}.mark{position:absolute;width:5px;height:5px;background:currentColor;border-radius:50%;bottom:4px;left:50%;transform:translateX(-50%)}
.smallbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap}.data{margin-bottom:12px}.data p{font-size:13px;color:#777;line-height:1.6}
dialog{border:0;border-radius:22px;width:min(92vw,520px);padding:0;box-shadow:0 25px 70px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.28)}.modal{padding:18px}.modal h3{margin:0 0 10px}.modal textarea{width:100%;min-height:110px;border:1px solid #ccc;border-radius:14px;padding:13px;font-size:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.timefield{display:block;font-size:12px;font-weight:800;color:#333}
.timefield span{display:block;font-size:10px;font-weight:500;color:#888;margin:2px 0 6px}
.fields input{width:100%;padding:13px 10px;border:1px solid #bbb;border-radius:12px;background:#fff;font-size:17px;font-weight:700}
.fields.single{grid-template-columns:1fr}
.slot-list{display:grid;gap:9px;margin-top:12px;max-height:55dvh;overflow:auto}
.slot-btn{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left}
.slot-btn:active{background:#f0f0ec}
.slot-arrow{display:block;color:#999;font-size:11px;margin:5px 0}
.slot-name{font-weight:800;font-size:14px;line-height:1.35}
.slot-time{font-size:11px;color:#777;margin-top:3px}
.auto-end{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:#f1f1ed;color:#555;font-size:12px;line-height:1.5}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:12px}.actions button{padding:12px;border-radius:13px;font-weight:800}.cancel{border:1px solid var(--line);background:#fff}.save{border:0;background:#111;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <section id="today" class="view on">
    <div class="titleline"><h1>今日の実績</h1><span class="version">ver.3.2</span></div><div class="sub" id="now"></div>
    <h2>今日のタイムライン <span id="count" style="float:right;color:#777;font-size:12px"></span></h2>
    <div id="timeline"></div>
  </section>

  <section id="history" class="view">
    <h1>カレンダー</h1><div class="sub">過去の実績を日付から見返せます。</div>
    <div class="cal">
      <div class="calhead"><button class="smallbtn" id="prev">‹</button><b id="month"></b><button class="smallbtn" id="next">›</button></div>
      <div class="calgrid" id="week"></div><div class="calgrid" id="days"></div>
    </div>
    <h2 id="pickedTitle"></h2>
    <button class="smallbtn history-add" id="addHistory">＋ この日に記録を追加</button>
    <div id="picked"></div>
  </section>

  <section id="data" class="view">
    <h1>データ</h1><div class="sub">AIに渡したり、バックアップできます。</div>
    <div class="card data"><b>AIに渡す</b><p>AIに貼り付けやすいテキスト形式でコピーします。</p><div class="row"><button class="smallbtn" id="copyToday">今日をコピー</button><button class="smallbtn" id="copyWeek">直近7日をコピー</button></div></div>
    <div class="card data"><b>バックアップ</b><p>記録はこのSafari内に保存されます。ときどき書き出してください。</p><div class="row"><button class="smallbtn" id="json">JSON</button><button class="smallbtn" id="csv">CSV</button></div></div>
  </section>
</div>

<div class="quickbar" id="quickbar"><div class="quickbar-inner"><button class="mainbtn" id="add">＋ 今まで何してた？</button></div></div>
<nav><div class="navi"><button class="navbtn on" data-v="today">今日</button><button class="navbtn" data-v="history">履歴</button><button class="navbtn" data-v="data">データ</button></div></nav>

<dialog id="slotDlg">
    <div class="modal">
      <h3>どこに追加しますか？</h3>
      <div class="sub" id="slotDateLabel" style="margin-bottom:8px"></div>
      <div class="slot-list" id="slotList"></div>
      <div class="actions"><button type="button" class="cancel" id="cancelSlot">キャンセル</button><div></div></div>
    </div>
  </dialog>

<dialog id="dlg"><form method="dialog" class="modal" id="form">
    <h3 id="dtitle">今まで何してた？</h3>
    <div class="sub" id="modalDateLabel" style="margin-bottom:12px"></div>
    <textarea id="text" placeholder="例：卒論のフォームを修正した" required></textarea>
    <div class="fields" id="timeFields">
      <label class="timefield" id="startField">開始時刻<span>タップして変更</span><input id="start" type="time"></label>
      <label class="timefield" id="endField">終了時刻<span>タップして変更</span><input id="end" type="time"></label>
    </div>
    <div class="auto-end" id="autoEnd"></div>
    <div class="actions"><button type="button" class="cancel" id="cancel">キャンセル</button><button class="save" type="submit">記録する</button></div>
  </form></dialog>

<script>
(function(){
var KEY='actualTimeline.v1', entries=[], editing=null, entryMode='quick', modalDate=key(new Date()), insertPrevId=null, insertNextId=null, cursor=new Date(), picked=key(new Date());
function q(s){return document.querySelector(s)} function qa(s){return Array.from(document.querySelectorAll(s))}
function pad(n){return String(n).padStart(2,'0')} function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function local(d){return key(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function timeOnly(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function combine(dateKey,timeStr){if(!dateKey||!timeStr)return null;var p=dateKey.split('-'),t=timeStr.split(':');return new Date(+p[0],+p[1]-1,+p[2],+t[0],+t[1],0,0)}
function jpDate(k){var p=k.split('-');return (+p[1])+'月'+(+p[2])+'日'}
function time(v){if(!v)return '—';var d=new Date(v);return pad(d.getHours())+':'+pad(d.getMinutes())}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function load(){try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(entries))entries=[]}catch(e){entries=[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(entries));render()}
function list(k){return entries.filter(function(e){return e.date===k}).sort(function(a,b){return new Date(a.end)-new Date(b.end)})}
function dur(a,b){if(!a||!b)return '';var m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000)),h=Math.floor(m/60),r=m%60;return h?(h+'時間'+(r?r+'分':'')):(r+'分')}
function draw(el,arr){if(!arr.length){el.innerHTML='<div class="empty">まだ記録がありません。</div>';return}el.innerHTML=arr.map(function(e){return '<div class="entry"><div class="time">'+time(e.start)+'<br>→ '+time(e.end)+'</div><div class="rail"><span class="dot"></span></div><div class="ecard"><div><div class="txt">'+esc(e.text)+'</div><div class="meta">'+dur(e.start,e.end)+'</div></div><button class="more" data-id="'+e.id+'">•••</button></div></div>'}).join('')}
function renderToday(){var a=list(key(new Date()));q('#count').textContent=a.length+'件';draw(q('#timeline'),a)}
function renderCal(){var y=cursor.getFullYear(),m=cursor.getMonth();q('#month').textContent=y+'年 '+(m+1)+'月';q('#week').innerHTML=['日','月','火','水','木','金','土'].map(function(x){return '<div class="wd">'+x+'</div>'}).join('');var first=new Date(y,m,1),start=first.getDay(),last=new Date(y,m+1,0).getDate(),html='';for(var i=0;i<42;i++){var dt;if(i<start)dt=new Date(y,m,i-start+1);else if(i>=start+last)dt=new Date(y,m+1,i-start-last+1);else dt=new Date(y,m,i-start+1);var k=key(dt),cls='day'+(k===picked?' sel':'')+(k===key(new Date())?' today':'');html+='<button class="'+cls+'" data-day="'+k+'">'+dt.getDate()+(list(k).length?'<span class="mark"></span>':'')+'</button>'}q('#days').innerHTML=html;q('#pickedTitle').textContent=picked;draw(q('#picked'),list(picked))}
function render(){renderToday();renderCal()}
function prevEnd(k,end){var a=list(k).filter(function(e){return e.id!==editing&&new Date(e.end)<=end});return a.length?a[a.length-1].end:null}
function setEntryFields(mode){
  var history=mode==='history-insert';
  q('#timeFields').classList.toggle('single',history);
  q('#endField').style.display=history?'none':'block';
  q('#autoEnd').style.display=history?'block':'none';
}
function openNew(){
  editing=null;entryMode='quick';insertPrevId=null;insertNextId=null;var d=new Date(),pv=prevEnd(key(d),d);modalDate=key(d);
  setEntryFields(entryMode);
  q('#dtitle').textContent='今まで何してた？';q('#modalDateLabel').textContent=jpDate(modalDate);
  q('#text').value='';q('#end').value=timeOnly(d);q('#start').value=pv?timeOnly(new Date(pv)):'';
  q('#dlg').showModal();setTimeout(function(){q('#text').focus()},100)
}
function openHistoryAdd(){
  modalDate=picked;
  var a=list(modalDate);
  if(a.length<2){alert('間に追加するには、この日に2件以上の記録が必要です。');return}
  var slots=[];
  for(var i=0;i<a.length-1;i++){
    var prev=a[i],next=a[i+1];
    if(!next.start)continue;
    slots.push('<button class="slot-btn" data-slot-prev="'+prev.id+'" data-slot-next="'+next.id+'"><span class="slot-name">'+esc(prev.text)+'</span><span class="slot-time">'+time(prev.start)+'〜'+time(prev.end)+'</span><span class="slot-arrow">↓ この間に追加</span><span class="slot-name">'+esc(next.text)+'</span><span class="slot-time">'+time(next.start)+'〜'+time(next.end)+'</span></button>');
  }
  if(!slots.length){alert('追加できる区間がありません。');return}
  q('#slotDateLabel').textContent=jpDate(modalDate);
  q('#slotList').innerHTML=slots.join('');
  q('#slotDlg').showModal();
}
function chooseHistorySlot(prevId,nextId){
  var prev=entries.find(function(x){return x.id===prevId}),next=entries.find(function(x){return x.id===nextId});
  if(!prev||!next||!next.start)return;
  editing=null;entryMode='history-insert';insertPrevId=prevId;insertNextId=nextId;modalDate=prev.date;
  setEntryFields(entryMode);
  q('#dtitle').textContent='この間に記録を追加';
  q('#modalDateLabel').textContent=jpDate(modalDate)+'　'+prev.text+' → '+next.text;
  q('#text').value='';q('#start').value='';q('#end').value='';
  q('#autoEnd').textContent='終了時刻は次の「'+next.text+'」の開始時刻 '+time(next.start)+' に自動設定されます。';
  q('#slotDlg').close();q('#dlg').showModal();setTimeout(function(){q('#text').focus()},100)
}
q('#add').onclick=openNew;
q('#addHistory').onclick=openHistoryAdd;
q('#cancel').onclick=function(){q('#dlg').close()};
q('#cancelSlot').onclick=function(){q('#slotDlg').close()}
q('#form').onsubmit=function(ev){
  ev.preventDefault();
  var t=q('#text').value.trim();
  if(!t)return;

  if(entryMode==='history-insert'){
    var prev=entries.find(function(x){return x.id===insertPrevId});
    var next=entries.find(function(x){return x.id===insertNextId});
    var s=q('#start').value?combine(modalDate,q('#start').value):null;
    if(!prev||!next||!next.start){alert('前後の記録を確認できませんでした。もう一度追加位置を選んでください。');return}
    if(!s){alert('開始時刻を選んでください');return}
    var nextStart=new Date(next.start);
    var prevStart=prev.start?new Date(prev.start):null;
    if(prevStart && s<=prevStart){
      alert('開始時刻は、前の「'+prev.text+'」の開始時刻 '+time(prev.start)+' より後を選んでください。');
      return;
    }
    if(s>=nextStart){
      alert('開始時刻は、次の「'+next.text+'」が始まる '+time(next.start)+' より前を選んでください。');
      return;
    }

    prev.end=s.toISOString();
    entries.push({
      id:Date.now()+'-'+Math.random(),
      text:t,
      date:modalDate,
      start:s.toISOString(),
      end:nextStart.toISOString()
    });

    q('#dlg').close();
    entryMode='quick';insertPrevId=null;insertNextId=null;
    save();
    return;
  }

  var e=q('#end').value?combine(modalDate,q('#end').value):null;
  var s=q('#start').value?combine(modalDate,q('#start').value):null;
  if(!e)return;
  if(entryMode==='edit'&&!s){alert('開始時刻を選んでください');return}
  if(!s&&entryMode==='quick'){var p=prevEnd(modalDate,e);if(p)s=new Date(p)}
  if(s&&s>=e){alert('終了時刻は開始時刻より後にしてください');return}

  var savedId=editing||Date.now()+'-'+Math.random();
  if(editing){
    var ix=entries.findIndex(function(x){return x.id===editing});
    entries[ix]={id:savedId,text:t,date:modalDate,start:s?s.toISOString():null,end:e.toISOString()};
  }else{
    entries.push({id:savedId,text:t,date:modalDate,start:s?s.toISOString():null,end:e.toISOString()});
  }
  q('#dlg').close();editing=null;entryMode='quick';setEntryFields(entryMode);save()
}
document.addEventListener('click',function(ev){
var slot=ev.target.closest('[data-slot-prev]');
if(slot){chooseHistorySlot(slot.dataset.slotPrev,slot.dataset.slotNext);return}
var b=ev.target.closest('[data-id]');if(b){var id=b.dataset.id,act=prompt('「編集」または「削除」と入力してください');if(act==='削除'){if(confirm('削除しますか？')){entries=entries.filter(function(x){return x.id!==id});save()}}else if(act==='編集'){var x=entries.find(function(z){return z.id===id});editing=id;entryMode='edit';insertPrevId=null;insertNextId=null;modalDate=x.date;setEntryFields(entryMode);q('#dtitle').textContent='記録を編集';q('#modalDateLabel').textContent=jpDate(modalDate);q('#text').value=x.text;q('#start').value=x.start?timeOnly(new Date(x.start)):'';q('#end').value=timeOnly(new Date(x.end));q('#dlg').showModal()}return}var d=ev.target.closest('[data-day]');if(d){picked=d.dataset.day;var p=picked.split('-');cursor=new Date(+p[0],+p[1]-1,1);renderCal()}})
qa('.navbtn').forEach(function(b){b.onclick=function(){qa('.navbtn').forEach(function(x){x.classList.remove('on')});b.classList.add('on');qa('.view').forEach(function(x){x.classList.remove('on')});q('#'+b.dataset.v).classList.add('on');q('#quickbar').style.display=b.dataset.v==='today'?'block':'none'}})
q('#prev').onclick=function(){cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);renderCal()};q('#next').onclick=function(){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);renderCal()}
function makeText(a){var g={};a.slice().sort(function(x,y){return new Date(x.end)-new Date(y.end)}).forEach(function(e){(g[e.date]||(g[e.date]=[])).push(e)});return Object.keys(g).map(function(k){return k+'\n'+g[k].map(function(e){return time(e.start)+'-'+time(e.end)+' '+e.text}).join('\n')}).join('\n\n')}
async function copy(t){try{await navigator.clipboard.writeText(t);alert('コピーしました')}catch(e){alert(t)}}
q('#copyToday').onclick=function(){copy(makeText(list(key(new Date()))))};q('#copyWeek').onclick=function(){var en=new Date(),st=new Date();st.setDate(st.getDate()-6);st.setHours(0,0,0,0);copy(makeText(entries.filter(function(e){var d=new Date(e.end);return d>=st&&d<=en})))}
function dl(n,c,t){var a=document.createElement('a'),u=URL.createObjectURL(new Blob([c],{type:t}));a.href=u;a.download=n;a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
q('#json').onclick=function(){dl('timeline-'+key(new Date())+'.json',JSON.stringify(entries,null,2),'application/json')};q('#csv').onclick=function(){var rows=[['date','start','end','text']].concat(entries.map(function(e){return [e.date,e.start||'',e.end,e.text]}));var c='\ufeff'+rows.map(function(r){return r.map(function(x){return '"'+String(x||'').replace(/"/g,'""')+'"'}).join(',')}).join('\n');dl('timeline-'+key(new Date())+'.csv',c,'text/csv')}
function clock(){var d=new Date();q('#now').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes())}clock();setInterval(clock,30000);load();render();if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})
})();
</script>
</body>
</html>
